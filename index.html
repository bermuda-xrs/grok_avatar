<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; font: 13px sans-serif; }
  body { display: flex; }

  #bubbles { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 6px; padding: 0 6px 80px 0; overflow: hidden; }
  .bubble { max-width: 230px; padding: 8px 10px; border-radius: 14px 14px 4px 14px; background: #2b2b2f; color: #eee; box-shadow: 0 2px 8px #0006; cursor: pointer; animation: in .2s; }
  .bubble b { display: block; margin-bottom: 2px; font-size: 11px; color: #9ab; }
  .bubble span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  @keyframes in { from { opacity: 0; transform: translateX(12px); } }

  #side { width: 160px; }
  #avatar { display: block; width: 160px; height: 160px; object-fit: contain; cursor: grab; -webkit-user-drag: none; }
  #avatar.empty { border-radius: 50%; background: #7aa2ff; transform: scale(.4); }
  #target, #msg { display: none; width: 148px; margin: 4px; border: 0; border-radius: 8px; background: #222; color: #eee; outline: 0; }
  #target { margin-bottom: 0; padding: 4px; }
  #msg { padding: 6px; }
  #side.open #target, #side.open #msg { display: block; }

  #usage { position: fixed; top: 2px; right: 4px; padding: 2px 7px; border-radius: 10px; background: #222c; font: 600 11px sans-serif; pointer-events: none; }
</style>

<div id="usage" hidden></div>
<div id="bubbles"></div>
<div id="side">
  <img id="avatar">
  <select id="target"></select>
  <input id="msg" placeholder="message → Grok Bot ⏎">
</div>

<script src="renderer.js"></script>
